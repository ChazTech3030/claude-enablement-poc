name: setup-dk
description: Python, WeasyPrint system libraries and the dk builder
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: builder/pyproject.toml
    - name: WeasyPrint system libraries
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends \
          libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core >/dev/null
    - name: Install dk
      shell: bash
      run: pip install -q -e "builder[pdf,test]" "moto[dynamodb,ssm,s3]>=5" "cryptography>=43"
