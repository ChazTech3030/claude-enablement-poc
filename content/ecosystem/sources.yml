# Official Claude update sources, collected by `dk updates` into the Claude updates dashboard
# (/c/internal/updates/). Every URL below was checked on 27 September 2026.
#
# type:
#   feed                RSS or Atom (docs changelogs, GitHub release feeds)
#   release_notes_page  help-centre release notes: dated sections, one item per bold feature title
#   news_page           listing page of dated article cards (anthropic.com/news)
#   blog_page           listing page of article cards (claude.com/blog)
#   marketplace         plugin marketplace index (marketplace.json): reports plugins added since the last check
#
# Not included yet: status.claude.com (incidents, not updates), YouTube (serves a consent page to
# scripts), X/LinkedIn (no free feed; X needs its paid API).
sources:
  # ---- Claude apps (web, desktop, mobile) ----
  - id: claude-apps-release-notes
    title: Claude apps release notes
    category: Claude apps
    type: release_notes_page
    url: https://support.claude.com/en/articles/12138966-release-notes
    url_verified: true
    owner: platform

  # ---- Claude Platform (API) ----
  - id: docs-release-notes
    title: Claude Platform release notes
    category: Claude Platform
    type: feed
    url: https://platform.claude.com/docs/en/release-notes/feed.xml
    url_verified: true
    owner: platform

